name: lexora-legal

x-app: &app
  build: .
  image: lexora-legal:local
  # Shared database and application credentials come from the same file as host PHP.
  env_file: .env
  environment:
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    SESSION_DRIVER: file
  volumes:
    - app-storage:/var/www/html/storage

services:
  migrate:
    <<: *app
    # Laravel checks its migration ledger and applies only pending migrations.
    # Run status afterwards so a fresh database is supported too.
    command:
      - su
      - -s
      - /bin/sh
      - -c
      - |
        set -eu
        php artisan migrate --force --no-interaction
        php artisan migrate:status --no-interaction
      - www-data
    restart: "no"

  app:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/api/v1/health') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=30", "--max-time=3600"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 45s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  app-storage:
