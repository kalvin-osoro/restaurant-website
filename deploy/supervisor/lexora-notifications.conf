; Host deployment example. Adjust paths, PHP binary and user before installing.
; Docker Compose already runs both processes; do not also run these for that stack.
[program:lexora-queue]
directory=/var/www/lexora-legal
command=/usr/bin/php artisan queue:work --sleep=3 --tries=3 --timeout=30 --max-time=3600
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=45
redirect_stderr=true
stdout_logfile=/var/www/lexora-legal/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:lexora-scheduler]
directory=/var/www/lexora-legal
command=/usr/bin/php artisan schedule:work
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=45
redirect_stderr=true
stdout_logfile=/var/www/lexora-legal/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
